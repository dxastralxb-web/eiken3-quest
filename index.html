
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検3級 QUEST</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f6ff;color:#24304a;margin:0;padding:18px}
main{max-width:560px;margin:auto}
header,.panel{background:white;padding:20px;border-radius:18px;margin-bottom:15px}
h1{margin:0;font-size:26px;color:#4059a9}
.sub{color:#65718b}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;background:#4059a9;color:white;font-size:16px;font-weight:bold}
button.choice{background:#edf0ff;color:#24304a;text-align:left}
button:disabled{opacity:.65}
#feedback{font-weight:bold;line-height:1.7}
</style>
</head>
<body>
<main>
<header>
<h1>⚔️ 英検3級 QUEST</h1>
<p class="sub">1日5分！ 英語の冒険を始めよう</p>
<strong>⭐ 正解数：<span id="score">0</span></strong>
</header>
<section class="panel">
<h2>今日のミッション</h2>
<button onclick="start('word')">📘 単語クエスト</button>
<button onclick="start('grammar')">🧩 文法クエスト</button>
<button onclick="start('talk')">💬 会話クエスト</button>
<div id="quiz" hidden>
<p id="progress"></p>
<h3 id="question"></h3>
<div id="choices"></div>
<p id="feedback" aria-live="polite"></p>
<button id="next" onclick="nextQuestion()" hidden>次の問題へ ➜</button>
</div>
</section>
<section class="panel">
<h3>🎯 勉強のコツ</h3>
<p>間違えても大丈夫！ ヒントを読んで、少しずつ覚えよう。</p>
<button onclick="showHint()">💡 ヒントを見る</button>
<p id="hint"></p>
</section>
</main>
<script>
const data={
word:[
["「usually」の意味は？",["いつも","ときどき","昨日"],0,"usually＝たいてい、ふつうは"],
["「borrow」の意味は？",["売る","借りる","作る"],1,"borrow＝借りる"],
["「famous」の意味は？",["有名な","難しい","親切な"],0,"famous＝有名な"],
["「arrive」の意味は？",["出発する","到着する","忘れる"],1,"arrive＝到着する"],
["「enough」の意味は？",["十分な","高価な","静かな"],0,"enough＝十分な"]
],
grammar:[
["She ( ) tennis every Sunday.",["play","plays","playing"],1,"主語がSheなら、現在形の動詞にsがつくよ。"],
["I have lived here ( ) 2020.",["for","since","during"],1,"sinceは始まった時点、forは期間。"],
["I want ( ) a doctor.",["be","to be","being"],1,"want to＋動詞の原形＝～したい。"],
["If it ( ) tomorrow, I will stay home.",["rains","rain","rained"],0,"Ifの中は、未来のことでも現在形を使うよ。"],
["This book is ( ) than that one.",["interesting","more interesting","most interesting"],1,"長めの形容詞の比較級はmore＋形容詞。"]
],
talk:[
["A: How was your weekend? B: ( )",["It was great.","I am thirteen.","At seven."],0,"How was ～? は「～はどうだった？」"],
["A: Would you like some tea? B: ( )",["Yes, please.","I like tea yesterday.","At home."],0,"Would you like ～? は「～はいかが？」"],
["A: Thank you for your help. B: ( )",["You're welcome.","I'm twelve.","Good morning yesterday."],0,"You're welcome.＝どういたしまして。"],
["A: What do you think of this movie? B: ( )",["I think it's great.","I went by bus.","It's on Monday."],0,"What do you think of ～? は感想を聞く表現。"],
["A: Could you open the window? B: ( )",["Sure.","I'm a student.","Yesterday."],0,"Could you ～? は丁寧なお願い。"]
]
};
let type="word",index=0,questions=[],correct=false;
let score=Number(localStorage.getItem("eikenScore")||0);
document.getElementById("score").textContent=score;
function start(t){
type=t;index=0;questions=data[t];
document.getElementById("quiz").hidden=false;
document.getElementById("hint").textContent="";
showQuestion();
}
function showQuestion(){
let q=questions[index];correct=false;
document.getElementById("progress").textContent=`問題 ${index+1} / ${questions.length}`;
document.getElementById("question").textContent=q[0];
document.getElementById("feedback").textContent="";
document.getElementById("next").hidden=true;
let c=document.getElementById("choices");c.innerHTML="";
q[1].forEach((v,i)=>{
let b=document.createElement("button");b.className="choice";
b.textContent=["A","B","C"][i]+"： "+v;
b.onclick=()=>answer(i);c.appendChild(b);
});
}
function answer(i){
if(correct)return;
correct=true;
let q=questions[index];
document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
if(i===q[2]){
score++;localStorage.setItem("eikenScore",score);
document.getElementById("score").textContent=score;
document.getElementById("feedback").textContent="🎉 正解！ "+q[3];
}else{
document.getElementById("feedback").textContent="惜しい！ 正解は "+["A","B","C"][q[2]]+"。 "+q[3];
}
document.getElementById("next").hidden=false;
document.getElementById("next").textContent=index===questions.length-1?"もう一度挑戦！":"次の問題へ ➜";
}
function nextQuestion(){
if(index===questions.length-1){start(type);return;}
index++;showQuestion();
}
function showHint(){
if(document.getElementById("quiz").hidden){
document.getElementById("hint").textContent="まずは単語クエストから挑戦！ わからなくても、答えの解説を読めばOK。";
}else{
document.getElementById("hint").textContent=questions[index][3];
}
}
</script>
</body>
</html>
